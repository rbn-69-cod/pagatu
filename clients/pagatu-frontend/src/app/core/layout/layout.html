<header class="header">
  <a routerLink="/" class="home-link">pagatu</a>
  <span class="sesion" style="margin-left: auto; margin-right: 1rem; font-size: 0.9rem; color: #9ca3af;">
    @if (auth.autenticado()) {
      Sesión activa ({{ auth.roles().join(', ') }})
    }
  </span>
  @if (auth.autenticado()) {
    <button type="button" (click)="auth.cerrarSesion()" style="background: #374151; color: white; border: 1px solid #4b5563; padding: 0.25rem 0.75rem; border-radius: 0.25rem; cursor: pointer;">Cerrar sesión</button>
  }
</header>

<div class="body">
  <nav class="sidebar" aria-label="Menú principal">
    <a routerLink="/categorias" routerLinkActive="active">Categorías</a>
    <a routerLink="/ordenes/nueva" routerLinkActive="active">Nueva Orden</a>
    <a routerLink="/pedidos" routerLinkActive="active">Mis Pedidos</a>
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
